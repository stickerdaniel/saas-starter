name: Require English PR Metadata

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: english-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  english-metadata:
    name: English PR Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out trusted policy revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - name: Check pull request metadata
        run: bun scripts/english-policy/pr-metadata.bundle.mjs
