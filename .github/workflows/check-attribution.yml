name: Check Attribution

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-bot-coauthors:
    runs-on: ${{ vars.CI_CONTROL_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Check agent attribution and hidden Unicode
        uses: stickerdaniel/post-no-bills@308298394473ed80000cc5082ae93a1c5bc8563e # v4.1.0
        with:
          model-attribution: host
