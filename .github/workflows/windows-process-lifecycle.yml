name: Windows Process Lifecycle

on:
  push:
    branches: [main]
    paths:
      - 'scripts/dev-cloud.ts'
      - 'scripts/dev-cloud.test.ts'
      - 'scripts/windows-job.ts'
      - 'scripts/windows-job-runner.ps1'
      - '.github/workflows/windows-process-lifecycle.yml'
  pull_request:
    paths:
      - 'scripts/dev-cloud.ts'
      - 'scripts/dev-cloud.test.ts'
      - 'scripts/windows-job.ts'
      - 'scripts/windows-job-runner.ps1'
      - '.github/workflows/windows-process-lifecycle.yml'

permissions:
  contents: read

jobs:
  lifecycle:
    name: Windows Process Lifecycle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun vitest --run scripts/dev-cloud.test.ts
