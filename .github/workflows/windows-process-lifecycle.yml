name: Windows Process Lifecycle

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'bun.lock'
      - 'knowledge-policy.config.ts'
      - 'eslint/control-character-policy.js'
      - 'scripts/knowledge-policy/**'
      - 'scripts/dev-cloud.ts'
      - 'scripts/dev-cloud.test.ts'
      - 'scripts/git-context.ts'
      - 'scripts/static-checks.ts'
      - 'scripts/static-checks.test.ts'
      - 'scripts/static-checks.knip.test.ts'
      - 'scripts/terminal-output.ts'
      - 'scripts/test-executable.ts'
      - 'scripts/__fixtures__/static-checks/**'
      - 'scripts/windows-job.ts'
      - 'scripts/windows-job-runner.ps1'
      - '.github/workflows/windows-process-lifecycle.yml'
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  runner:
    name: Select lifecycle runner
    runs-on: ubicloud-standard-2
    outputs:
      label: ${{ steps.runner.outputs.label }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 2
      - name: Select runner
        id: runner
        shell: bash
        run: |
          # Workflow syntax and cross-platform wiring run on Ubicloud. Source
          # and test changes whose behavior differs on Windows use Windows.
          pattern='^(package\.json|bun\.lock|scripts/(dev-cloud(\.test)?\.ts|windows-job(\.ts|-runner\.ps1)))$'
          set +e
          set -o pipefail
          git diff --name-only --no-renames HEAD^1 HEAD | grep -E "$pattern" > /dev/null
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo 'label=windows-latest' >> "$GITHUB_OUTPUT"
          elif [[ $status -eq 1 ]]; then
            echo 'label=ubicloud-standard-2' >> "$GITHUB_OUTPUT"
          else
            # Never select the cheaper runner from a failed read.
            echo 'label=windows-latest' >> "$GITHUB_OUTPUT"
          fi

  lifecycle:
    name: Windows Process Lifecycle
    needs: runner
    runs-on: ${{ needs.runner.outputs.label }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Detect relevant changes
        id: changes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if ($env:EVENT_NAME -eq 'push') {
            'run_tests=true' >> $env:GITHUB_OUTPUT
            exit 0
          }

          $pattern = '^(package\.json|bun\.lock|knowledge-policy\.config\.ts|eslint/control-character-policy\.js|scripts/(dev-cloud(\.test)?\.ts|git-context\.ts|knowledge-policy/.*|static-checks(\.test|\.knip\.test)?\.ts|terminal-output\.ts|test-executable\.ts|__fixtures__/static-checks/.*|windows-job(\.ts|-runner\.ps1))|\.github/workflows/windows-process-lifecycle\.yml)$'
          $files = gh api --paginate "repos/$env:GITHUB_REPOSITORY/pulls/$env:PR_NUMBER/files" --jq '.[].filename'
          $runTests = @($files | Where-Object { $_ -match $pattern }).Count -gt 0
          "run_tests=$($runTests.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - if: steps.changes.outputs.run_tests == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - if: steps.changes.outputs.run_tests == 'true'
        run: bun install --frozen-lockfile --ignore-scripts
      - if: steps.changes.outputs.run_tests == 'true'
        run: bun vitest --run scripts/dev-cloud.test.ts
      - if: steps.changes.outputs.run_tests == 'true'
        run: bun vitest --run scripts/static-checks.knip.test.ts
