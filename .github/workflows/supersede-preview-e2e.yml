name: Supersede Preview E2E

# Two events delete the Convex preview that an "E2E Tests (CF Preview)" run of
# the branch is still testing:
# - A push starts a Workers build that runs `convex deploy --preview-create`
#   before it builds the app. The build's check run, which also cancels the
#   older run, arrives one to two minutes later, after the older run has failed
#   against the missing backend and published its verdict.
# - Closing the pull request runs delete-convex-preview.yml, which deletes the
#   preview within seconds. No check run follows to cancel the E2E run.
# On either event this run joins the E2E run's concurrency group and cancels
# it. A cancelled run publishes no verdict.
on:
  pull_request:
    types: [synchronize, closed]

permissions: {}

concurrency:
  # The head-build group of e2e-preview-cf.yml, keyed on that workflow's name.
  # A rerun and a fork branch get a group of their own, so neither cancels the
  # current head's run.
  group: E2E Tests (CF Preview)-${{ (github.run_attempt == 1 && github.event.pull_request.head.repo.full_name == github.repository) && github.event.pull_request.head.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  cancel:
    name: Cancel older preview E2E
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      # Joining the concurrency group above is the whole effect.
      - run: echo "Joined this branch's preview E2E concurrency group."
