name: Actionlint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint Workflows
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: reviewdog/action-actionlint@1758727be30241166609dad4c97588b6ad411f32 # v1.79.1
        with:
          # Log-only reporter: needs no write permissions and works on both
          # pull_request and push events. fail_level makes findings fail the job
          # instead of only annotating.
          reporter: github-annotations
          filter_mode: nofilter
          fail_level: error
          # GitHub validates concurrency.queue; actionlint 1.7.12 predates that
          # supported field. Keep every other syntax diagnostic enabled.
          actionlint_flags: '-ignore=^unexpected.key."queue".for."concurrency".section[.].expected.one.of."cancel-in-progress",."group"$'
