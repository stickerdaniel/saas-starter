name: Actionlint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'

permissions:
  contents: read

# Main pushes and PRs supersede older checks; a rerun keeps a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_attempt == 1 && (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  actionlint:
    name: Lint Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: reviewdog/action-actionlint@619a81ec64ff8c0211cd6146eb2b21e8f1d7f440 # v1.81.1
        with:
          # Log-only reporter: needs no write permissions and works on both
          # pull_request and push events. fail_level makes findings fail the job
          # instead of only annotating.
          reporter: github-annotations
          filter_mode: nofilter
          fail_level: error
          # GitHub validates concurrency.queue; actionlint 1.7.12 predates that
          # supported field. Keep every other syntax diagnostic enabled.
          actionlint_flags: '-ignore=^unexpected.key."queue".for."concurrency".section[.].expected.one.of."cancel-in-progress",."group"$'
