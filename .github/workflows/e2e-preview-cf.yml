name: E2E Tests (CF Preview)

on:
  workflow_dispatch:
    inputs:
      preview_url:
        required: true
        type: string
        description: Existing Cloudflare preview URL
      sha:
        required: true
        type: string
        description: Exact deployed source SHA
      shards:
        default: '1'
        type: string
        description: Public shard count (1 runs the full serial suite)
  check_run:
    types: [completed]

jobs:
  # Clear pending E2E status for production builds (no preview alias) on PRs
  e2e-skipped:
    name: E2E Skipped Status
    runs-on: ubicloud-standard-2
    timeout-minutes: 2
    permissions:
      statuses: write
    if: |
      github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
      github.event.check_run.conclusion == 'success' &&
      !contains(github.event.check_run.output.summary || '', 'Preview Alias URL') &&
      github.event.check_run.pull_requests[0]
    steps:
      - name: Clear pending E2E status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ github.event.check_run.head_sha || inputs.sha }} \
            -f state=success \
            -f context="E2E Tests" \
            -f description="Skipped (production build, no preview)"

  # Resolve the required E2E status when the CF preview build does not succeed.
  # Without this, the pending status set by static-checks.yml would stay
  # pending forever and block merging on this SHA.
  e2e-build-failed:
    name: E2E Build Failed Status
    runs-on: ubicloud-standard-2
    timeout-minutes: 2
    permissions:
      statuses: write
    # conclusion is always terminal here because the trigger is check_run: [completed]
    if: |
      github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
      github.event.check_run.conclusion != 'success' &&
      github.event.check_run.pull_requests[0]
    steps:
      - name: Report build failure to PR
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.check_run.head_sha || inputs.sha }}
          CONCLUSION: ${{ github.event.check_run.conclusion }}
          TARGET_URL: ${{ github.event.check_run.html_url }}
        run: |
          for i in 1 2 3; do
            gh api "repos/${{ github.repository }}/statuses/${HEAD_SHA}" \
              -f state=failure \
              -f context="E2E Tests" \
              -f description="CF preview build ${CONCLUSION}, E2E skipped" \
              -f target_url="$TARGET_URL" \
              && exit 0
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "::warning::Failed to report status after 3 attempts"
          exit 1

  prepare:
    outputs:
      url: ${{ steps.metadata.outputs.url }}
      convex-url: ${{ steps.metadata.outputs.convex-url }}
      convex-site-url: ${{ steps.metadata.outputs.convex-site-url }}
      build-uuid: ${{ steps.metadata.outputs.build-uuid }}
      matrix: ${{ steps.partition.outputs.matrix }}
      count: ${{ steps.partition.outputs.count }}
      backend-key: ${{ steps.partition.outputs.backend-key }}
    name: E2E Tests
    runs-on: ubicloud-standard-2
    timeout-minutes: 25
    permissions:
      statuses: write
      contents: read
      checks: read
    # Only run on successful CF Workers preview builds (production builds lack Preview Alias URL)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
      github.event.check_run.conclusion == 'success' &&
      contains(github.event.check_run.output.summary || '', 'Preview Alias URL'))
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      AUTH_E2E_TEST_SECRET: ${{ secrets.AUTH_E2E_TEST_SECRET }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.check_run.head_sha || inputs.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # Selects the triggering (or latest dispatched) Cloudflare build record and
      # waits until the alias serves that build's source SHA and build UUID.
      # Nothing is exported or probed before that identity is accepted.
      - name: Discover the tested preview build
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_EXPECTED_SHA: ${{ github.event.check_run.head_sha || inputs.sha }}
          E2E_CHECK_RUN_ID: ${{ github.event.check_run.id }}
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: bun scripts/e2e-ci.ts discover

      - name: Wait for Convex backend readiness
        run: |
          echo "Waiting for Convex backend at: ${PUBLIC_CONVEX_URL}"

          # A cold preview backend can take about a minute to boot (the
          # Playwright config budgets 90s for auth setup for the same reason),
          # so the wait window must comfortably exceed one cold boot.
          # 24 attempts with backoff capped at 10s ≈ 3.5 minutes per round.
          wait_for_ready() {
            local missing=0 delay=3 code
            for i in $(seq 1 24); do
              code=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 "${PUBLIC_CONVEX_URL}" || true)
              if [ "$code" = "200" ]; then
                echo "Convex backend is ready (attempt $i)"
                return 0
              fi
              if [ "$code" = "404" ]; then
                missing=$((missing + 1))
                # Two consecutive 404s mean the preview deployment is gone
                # (evicted), not still booting: no amount of waiting helps.
                [ "$missing" -ge 2 ] && return 40
              else
                missing=0
              fi
              echo "Not ready yet (attempt $i/24, http=$code), waiting ${delay}s..."
              [ "$i" -lt 24 ] && sleep "$delay"
              [ "$delay" -lt 10 ] && delay=$((delay + 1))
            done
            return 1
          }

          rc=0
          wait_for_ready || rc=$?
          if [ "$rc" = "0" ]; then
            exit 0
          elif [ "$rc" = "40" ]; then
            # The accepted build's backend was evicted. A rebuild produces a new
            # build identity, which this run must not adopt.
            echo "::error::Convex preview backend of build ${E2E_BUILD_UUID} is gone (HTTP 404): ${PUBLIC_CONVEX_URL}"
            echo "::error::Rerun the Cloudflare Workers build for this commit (or push a new commit); its completion starts a fresh E2E run."
            exit 1
          fi
          echo "::error::Convex backend not ready within the wait window: ${PUBLIC_CONVEX_URL}"
          exit 1

      - name: Log test configuration
        run: |
          echo "Testing against CF preview deployment:"
          echo "  PUBLIC_SITE_URL: $PUBLIC_SITE_URL"
          echo "  E2E_BUILD_UUID: $E2E_BUILD_UUID"
          echo "  PUBLIC_CONVEX_URL: $PUBLIC_CONVEX_URL"
          echo "  PUBLIC_CONVEX_SITE_URL: $PUBLIC_CONVEX_SITE_URL"

      - name: Export discovered target
        id: metadata
        run: |
          {
            echo "url=$PUBLIC_SITE_URL"
            echo "convex-url=$PUBLIC_CONVEX_URL"
            echo "convex-site-url=$PUBLIC_CONVEX_SITE_URL"
            echo "build-uuid=$E2E_BUILD_UUID"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare safe browser partition
        id: partition
        env:
          E2E_PUBLIC_SHARDS: ${{ inputs.shards || vars.E2E_PUBLIC_SHARDS }}
        run: bun scripts/e2e-ci.ts prepare

  exclusive:
    name: Exclusive preview coverage
    needs: prepare
    runs-on: ${{ vars.E2E_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    permissions:
      contents: read
    concurrency:
      group: preview-e2e-${{ needs.prepare.outputs.backend-key }}
      cancel-in-progress: false
      queue: max
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=4096
      PUBLIC_SITE_URL: ${{ needs.prepare.outputs.url }}
      PUBLIC_CONVEX_URL: ${{ needs.prepare.outputs.convex-url }}
      PUBLIC_CONVEX_SITE_URL: ${{ needs.prepare.outputs.convex-site-url }}
      E2E_EXPECTED_SHA: ${{ github.event.check_run.head_sha || inputs.sha }}
      E2E_BUILD_UUID: ${{ needs.prepare.outputs.build-uuid }}
      E2E_TARGET: cf
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.check_run.head_sha || inputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/e2e-run
        with:
          lane: ${{ needs.prepare.outputs.count == '1' && 'full' || 'exclusive' }}
          metadata-policy: cf-build
          count: ${{ needs.prepare.outputs.count }}
          auth-secret: ${{ secrets.AUTH_E2E_TEST_SECRET }}
          cf-access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          cf-access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

  public:
    name: Public preview shard ${{ matrix.shard }}
    needs: prepare
    if: needs.prepare.outputs.count != '1'
    runs-on: ${{ vars.E2E_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.E2E_MAX_PARALLEL || '2') }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=4096
      PUBLIC_SITE_URL: ${{ needs.prepare.outputs.url }}
      PUBLIC_CONVEX_URL: ${{ needs.prepare.outputs.convex-url }}
      PUBLIC_CONVEX_SITE_URL: ${{ needs.prepare.outputs.convex-site-url }}
      E2E_EXPECTED_SHA: ${{ github.event.check_run.head_sha || inputs.sha }}
      E2E_BUILD_UUID: ${{ needs.prepare.outputs.build-uuid }}
      E2E_TARGET: cf
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.check_run.head_sha || inputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/e2e-run
        with:
          lane: public
          metadata-policy: cf-build
          shard: ${{ matrix.shard }}
          count: ${{ needs.prepare.outputs.count }}
          cf-access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          cf-access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

  aggregate:
    name: Complete preview verdict
    needs: [prepare, exclusive, public]
    if: always() && needs.prepare.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.check_run.head_sha || inputs.sha }}
          persist-credentials: false
      - name: Require successful children
        env:
          PREPARE: ${{ needs.prepare.result }}
          EXCLUSIVE: ${{ needs.exclusive.result }}
          PUBLIC: ${{ needs.public.result }}
          COUNT: ${{ needs.prepare.outputs.count }}
        run: |
          test "$PREPARE" = success && test "$EXCLUSIVE" = success
          if [ "$COUNT" = 1 ]; then test "$PUBLIC" = skipped; else test "$PUBLIC" = success; fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: e2e-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: e2e-evidence
      - name: Reconcile actual execution against complete inventory
        run: bun scripts/e2e-ci.ts reconcile e2e-evidence
      - name: Report complete verdict
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.check_run.head_sha || inputs.sha }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          for attempt in 1 2 3; do
            if gh api "repos/${{ github.repository }}/statuses/$HEAD_SHA" \
              -f state="$STATE" -f context="E2E Tests" \
              -f description="Complete preview E2E (cf)" \
              -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"; then exit 0; fi
            echo "Status reporting attempt $attempt failed"
            sleep 5
          done
          exit 1
