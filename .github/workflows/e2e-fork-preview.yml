name: E2E Tests (Fork Preview)

# Builds a Cloudflare Workers preview and runs Playwright E2E for FORK pull
# requests, gated behind the `fork-preview` Environment (required reviewer).
# Cloudflare Workers Builds does not build fork PRs, and a fork `pull_request`
# gets no secrets / a read-only token, so this uses `pull_request_target`
# (base-repo context: secrets + read-write token) and only runs after a
# maintainer approves the `fork-preview` deployment. Approving means trusting
# the entire checked-out fork tree (lockfile, install/postinstall scripts,
# scripts/deploy*, tests) to run with the preview-scoped secrets.
#
# Same-repo PRs are skipped here (they use CF Workers Builds + e2e-preview-cf.yml).
#
# NOTE: Convex preview-quota recovery is intentionally disabled (no
# CONVEX_MANAGEMENT_TOKEN in this environment), so a quota hit fails the run;
# prune old previews and re-run.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: fork-e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    outputs:
      url: ${{ steps.metadata.outputs.url }}
      convex-url: ${{ steps.metadata.outputs.convex-url }}
      convex-site-url: ${{ steps.metadata.outputs.convex-site-url }}
      matrix: ${{ steps.partition.outputs.matrix }}
      count: ${{ steps.partition.outputs.count }}
      backend-key: ${{ steps.partition.outputs.backend-key }}
    name: Fork Preview E2E
    # Forks only. Same-repo PRs keep CF Workers Builds + e2e-preview-cf.yml.
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubicloud-standard-2
    environment: fork-preview
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    env:
      # CF Workers Builds mimicry (so scripts/deploy.ts detects a preview build)
      WORKERS_CI: '1'
      WORKERS_CI_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      PRODUCTION_BRANCH: main
      # Base-repo-unique preview key: fork branch names are not unique across
      # forks, which would collide on the Workers alias and Convex preview.
      WORKERS_CI_BRANCH: fork-pr-${{ github.event.pull_request.number }}
      WORKERS_NAME: ${{ vars.WORKERS_NAME }}
      WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN }}
      CONVEX_PROJECT_ID: ${{ vars.CONVEX_PROJECT_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NODE_OPTIONS: --max-old-space-size=4096
      CI: 'true'

    steps:
      - name: Checkout reviewed fork SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Don't leave the read-write pull_request_target token in .git/config
          # where the untrusted checkout's install scripts could grab it.
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # No secrets in env here: untrusted postinstall must not see them.
      - name: Install dependencies
        run: bun install

      - name: Build and deploy fork preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CONVEX_PREVIEW_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          # Build + Convex preview deploy + e2e-config + SvelteKit build
          bunx varlock run -- bun scripts/deploy.ts
          # Upload the worker version with a preview alias (must exit 0)
          bun scripts/cf-deploy.ts
          # Compute the preview URL only after a successful upload, using the
          # canonical alias function (single source of truth) — do not parse
          # cf-deploy stdout (it logs the alias before the upload runs).
          ALIAS=$(bun -e 'import("./scripts/deploy/platform.ts").then((m) => { process.stdout.write(m.sanitizeBranchAlias(process.env.WORKERS_CI_BRANCH, process.env.WORKERS_NAME)); })')
          PREVIEW_URL="https://${ALIAS}-${WORKERS_NAME}.${WORKERS_SUBDOMAIN}.workers.dev"
          echo "PREVIEW_URL=${PREVIEW_URL}" >> "$GITHUB_ENV"
          echo "Preview URL: ${PREVIEW_URL}"

      # Same-repo PRs get a preview-URL comment from the Cloudflare app; fork
      # PRs are deployed by this job, so post the equivalent comment ourselves.
      # Sticky: later pushes update the existing comment instead of adding one.
      # Only trusted values reach the body (PR number, hex SHA, run id, and a
      # PREVIEW_URL derived from repo vars + PR number).
      - name: Comment preview URL on PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          MARKER='<!-- fork-preview-url -->'
          UPDATED=$(date -u '+%b %d %Y, %H:%M UTC')
          BODY=$(printf '%s\n## Fork preview deployment\nBuilt and deployed by the [Fork Preview E2E workflow](%s).\n\n| Status | Commit | Preview URL | Updated (UTC) |\n| - | - | - | - |\n| ✅ Deployment successful | %s | %s | %s |\n' \
            "$MARKER" "$RUN_URL" "${HEAD_SHA:0:7}" "$PREVIEW_URL" "$UPDATED")
          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$MARKER\"))][0].id // empty")
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" -f body="$BODY" > /dev/null
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" -f body="$BODY" > /dev/null
          fi

      - name: Fetch E2E config from preview
        run: |
          set -euo pipefail
          echo "Fetching config from: ${PREVIEW_URL}/.well-known/e2e-config.json"
          CONFIG=$(curl -sf "${PREVIEW_URL}/.well-known/e2e-config.json")
          echo "$CONFIG" | jq .
          {
            echo "PUBLIC_CONVEX_URL=$(echo "$CONFIG" | jq -r '.convexUrl')"
            echo "PUBLIC_CONVEX_SITE_URL=$(echo "$CONFIG" | jq -r '.convexSiteUrl')"
            echo "PUBLIC_SITE_URL=${PREVIEW_URL}"
          } >> "$GITHUB_ENV"

      - name: Wait for Convex backend readiness
        run: |
          echo "Waiting for Convex backend at: ${PUBLIC_CONVEX_URL}"
          # A cold preview backend can take about a minute to boot (the
          # Playwright config budgets 90s for auth setup for the same reason),
          # so the wait window must comfortably exceed one cold boot: 24
          # attempts with backoff capped at 10s ≈ 3.5 minutes. No 404
          # self-heal here — the deploy ran moments ago in this same job, so
          # persistent 404s mean the deploy itself is broken.
          missing=0
          delay=3
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 "${PUBLIC_CONVEX_URL}" || true)
            if [ "$code" = "200" ]; then
              echo "Convex backend is ready (attempt $i)"
              exit 0
            fi
            if [ "$code" = "404" ]; then
              missing=$((missing + 1))
              if [ "$missing" -ge 2 ]; then
                echo "::error::Convex preview backend is gone (HTTP 404 at ${PUBLIC_CONVEX_URL})."
                echo "::error::Recreate it by rerunning the preview deployment for this commit or pushing an empty commit."
                exit 1
              fi
            else
              missing=0
            fi
            echo "Not ready yet (attempt $i/24, http=$code), waiting ${delay}s..."
            [ "$i" -lt 24 ] && sleep "$delay"
            [ "$delay" -lt 10 ] && delay=$((delay + 1))
          done
          echo "::error::Convex backend not ready within the wait window (last http=$code): ${PUBLIC_CONVEX_URL}"
          exit 1

      - name: Export discovered target
        id: metadata
        run: |
          {
            echo "url=$PUBLIC_SITE_URL"
            echo "convex-url=$PUBLIC_CONVEX_URL"
            echo "convex-site-url=$PUBLIC_CONVEX_SITE_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare safe browser partition
        id: partition
        env:
          E2E_PUBLIC_SHARDS: ${{ vars.E2E_PUBLIC_SHARDS }}
        run: bun scripts/e2e-ci.ts prepare

  exclusive:
    name: Exclusive preview coverage
    needs: prepare
    runs-on: ${{ vars.E2E_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    environment: fork-preview
    permissions:
      contents: read
    concurrency:
      group: preview-e2e-${{ needs.prepare.outputs.backend-key }}
      cancel-in-progress: false
      queue: max
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=4096
      PUBLIC_SITE_URL: ${{ needs.prepare.outputs.url }}
      PUBLIC_CONVEX_URL: ${{ needs.prepare.outputs.convex-url }}
      PUBLIC_CONVEX_SITE_URL: ${{ needs.prepare.outputs.convex-site-url }}
      E2E_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      E2E_TARGET: cf
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/e2e-run
        with:
          lane: ${{ needs.prepare.outputs.count == '1' && 'full' || 'exclusive' }}
          count: ${{ needs.prepare.outputs.count }}
          auth-secret: ${{ secrets.AUTH_E2E_TEST_SECRET }}

  public:
    name: Public preview shard ${{ matrix.shard }}
    needs: prepare
    if: needs.prepare.outputs.count != '1'
    runs-on: ${{ vars.E2E_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    environment: fork-preview
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.E2E_MAX_PARALLEL || '2') }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=4096
      PUBLIC_SITE_URL: ${{ needs.prepare.outputs.url }}
      PUBLIC_CONVEX_URL: ${{ needs.prepare.outputs.convex-url }}
      PUBLIC_CONVEX_SITE_URL: ${{ needs.prepare.outputs.convex-site-url }}
      E2E_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      E2E_TARGET: cf
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/e2e-run
        with:
          lane: public
          shard: ${{ matrix.shard }}
          count: ${{ needs.prepare.outputs.count }}

  aggregate:
    name: Complete preview verdict
    needs: [prepare, exclusive, public]
    if: always() && needs.prepare.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Require successful children
        env:
          PREPARE: ${{ needs.prepare.result }}
          EXCLUSIVE: ${{ needs.exclusive.result }}
          PUBLIC: ${{ needs.public.result }}
          COUNT: ${{ needs.prepare.outputs.count }}
        run: |
          test "$PREPARE" = success && test "$EXCLUSIVE" = success
          if [ "$COUNT" = 1 ]; then test "$PUBLIC" = skipped; else test "$PUBLIC" = success; fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: e2e-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: e2e-evidence
      - name: Reconcile actual execution against complete inventory
        run: bun scripts/e2e-ci.ts reconcile e2e-evidence
      - name: Report complete verdict
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/$HEAD_SHA" \
            -f state="$STATE" -f context="E2E Tests" \
            -f description="Complete preview E2E (cf)" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh api "repos/${{ github.repository }}/statuses/$HEAD_SHA" \
            -f state="$STATE" -f context="Workers Builds: saas-starter" \
            -f description="Fork preview ($STATE)" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
