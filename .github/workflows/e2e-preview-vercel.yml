name: E2E Tests (Vercel Preview)

on:
  deployment_status:

# Least-privilege default; jobs that post commit statuses override with
# statuses: write at the job level.
permissions:
  contents: read

jobs:
  prepare:
    outputs:
      url: ${{ steps.metadata.outputs.url }}
      convex-url: ${{ steps.metadata.outputs.convex-url }}
      convex-site-url: ${{ steps.metadata.outputs.convex-site-url }}
      matrix: ${{ steps.partition.outputs.matrix }}
      count: ${{ steps.partition.outputs.count }}
      backend-key: ${{ steps.partition.outputs.backend-key }}
    name: E2E Tests
    runs-on: ubicloud-standard-2
    permissions:
      statuses: write
      contents: read
    # Only run on successful Vercel preview deployments
    if: |
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Preview'

    env:
      NODE_OPTIONS: --max-old-space-size=4096
      AUTH_E2E_TEST_SECRET: ${{ secrets.AUTH_E2E_TEST_SECRET }}
      PREVIEW_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      # Preview URL from deployment event
      PREVIEW_URL: ${{ github.event.deployment_status.environment_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.deployment.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Fetch E2E config from preview
        id: config
        run: |
          CONFIG_URL="${PREVIEW_URL}/.well-known/e2e-config.json"
          echo "Fetching config from: $CONFIG_URL"

          # Use preview bypass for protected deployments
          BYPASS_HEADER=""
          if [ -n "$PREVIEW_BYPASS_SECRET" ]; then
            BYPASS_HEADER="-H x-vercel-protection-bypass:${PREVIEW_BYPASS_SECRET}"
            echo "Using preview bypass"
          fi

          # Retry up to 5 times (deployment might take a moment to be fully ready)
          for i in {1..5}; do
            # Intentional word splitting for optional -H arg
            # shellcheck disable=SC2086
            if CONFIG=$(curl -sf $BYPASS_HEADER "$CONFIG_URL"); then
              echo "Config fetched successfully"
              echo "$CONFIG" | jq .

              # Extract values and set as env vars
              {
                echo "PUBLIC_CONVEX_URL=$(echo "$CONFIG" | jq -r '.convexUrl')"
                echo "PUBLIC_CONVEX_SITE_URL=$(echo "$CONFIG" | jq -r '.convexSiteUrl')"
                echo "PUBLIC_SITE_URL=${PREVIEW_URL}"
              } >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

          echo "::error::Failed to fetch E2E config after 5 attempts"
          exit 1

      - name: Log test configuration
        run: |
          echo "Testing against preview deployment:"
          echo "  PREVIEW_URL: $PREVIEW_URL"
          echo "  PUBLIC_CONVEX_URL: $PUBLIC_CONVEX_URL"
          echo "  PUBLIC_CONVEX_SITE_URL: $PUBLIC_CONVEX_SITE_URL"

      - name: Export discovered target
        id: metadata
        run: |
          {
            echo "url=$PUBLIC_SITE_URL"
            echo "convex-url=$PUBLIC_CONVEX_URL"
            echo "convex-site-url=$PUBLIC_CONVEX_SITE_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare safe browser partition
        id: partition
        env:
          E2E_PUBLIC_SHARDS: ${{ vars.E2E_PUBLIC_SHARDS }}
        run: bun scripts/e2e-ci.ts prepare

  # Resolve the required E2E status when the Vercel preview deployment fails.
  # Without this, the pending status set by static-checks.yml would stay
  # pending forever and block merging on this SHA.
  e2e-deploy-failed:
    name: E2E Deploy Failed Status
    runs-on: ubicloud-standard-2
    permissions:
      statuses: write
    # deployment_status also fires for pending/in_progress/queued, so gate on
    # explicit terminal failure states only
    if: |
      github.event.deployment_status.environment == 'Preview' &&
      (github.event.deployment_status.state == 'failure' || github.event.deployment_status.state == 'error')
    steps:
      - name: Report deploy failure to PR
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.deployment.sha }}
          DEPLOY_STATE: ${{ github.event.deployment_status.state }}
          TARGET_URL: ${{ github.event.deployment_status.target_url || format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
        run: |
          for i in 1 2 3; do
            gh api "repos/${{ github.repository }}/statuses/${HEAD_SHA}" \
              -f state=failure \
              -f context="E2E Tests" \
              -f description="Vercel preview deploy ${DEPLOY_STATE}, E2E skipped" \
              -f target_url="$TARGET_URL" \
              && exit 0
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "::warning::Failed to report status after 3 attempts"
          exit 1

  exclusive:
    name: Exclusive preview coverage
    needs: prepare
    runs-on: ${{ vars.E2E_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    permissions:
      contents: read
    concurrency:
      group: preview-e2e-${{ needs.prepare.outputs.backend-key }}
      cancel-in-progress: false
      queue: max
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=4096
      PUBLIC_SITE_URL: ${{ needs.prepare.outputs.url }}
      PUBLIC_CONVEX_URL: ${{ needs.prepare.outputs.convex-url }}
      PUBLIC_CONVEX_SITE_URL: ${{ needs.prepare.outputs.convex-site-url }}
      E2E_EXPECTED_SHA: ${{ github.event.deployment.sha }}
      E2E_TARGET: vercel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.deployment.sha }}
          persist-credentials: false
      - uses: ./.github/actions/e2e-run
        with:
          lane: ${{ needs.prepare.outputs.count == '1' && 'full' || 'exclusive' }}
          count: ${{ needs.prepare.outputs.count }}
          auth-secret: ${{ secrets.AUTH_E2E_TEST_SECRET }}
          vercel-bypass-secret: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

  public:
    name: Public preview shard ${{ matrix.shard }}
    needs: prepare
    if: needs.prepare.outputs.count != '1'
    runs-on: ${{ vars.E2E_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.E2E_MAX_PARALLEL || '2') }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=4096
      PUBLIC_SITE_URL: ${{ needs.prepare.outputs.url }}
      PUBLIC_CONVEX_URL: ${{ needs.prepare.outputs.convex-url }}
      PUBLIC_CONVEX_SITE_URL: ${{ needs.prepare.outputs.convex-site-url }}
      E2E_EXPECTED_SHA: ${{ github.event.deployment.sha }}
      E2E_TARGET: vercel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.deployment.sha }}
          persist-credentials: false
      - uses: ./.github/actions/e2e-run
        with:
          lane: public
          shard: ${{ matrix.shard }}
          count: ${{ needs.prepare.outputs.count }}
          vercel-bypass-secret: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

  aggregate:
    name: Complete preview verdict
    needs: [prepare, exclusive, public]
    if: always() && needs.prepare.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.deployment.sha }}
          persist-credentials: false
      - name: Require successful children
        env:
          PREPARE: ${{ needs.prepare.result }}
          EXCLUSIVE: ${{ needs.exclusive.result }}
          PUBLIC: ${{ needs.public.result }}
          COUNT: ${{ needs.prepare.outputs.count }}
        run: |
          test "$PREPARE" = success && test "$EXCLUSIVE" = success
          if [ "$COUNT" = 1 ]; then test "$PUBLIC" = skipped; else test "$PUBLIC" = success; fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: e2e-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: e2e-evidence
      - name: Reconcile actual execution against complete inventory
        run: bun scripts/e2e-ci.ts reconcile e2e-evidence
      - name: Report complete verdict
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.deployment.sha }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          for attempt in 1 2 3; do
            if gh api "repos/${{ github.repository }}/statuses/$HEAD_SHA" \
              -f state="$STATE" -f context="E2E Tests" \
              -f description="Complete preview E2E (vercel)" \
              -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"; then exit 0; fi
            echo "Status reporting attempt $attempt failed"
            sleep 5
          done
          exit 1
