name: Static Checks

on:
  push:
    branches: [main]
  pull_request:

# The required "E2E Tests" status is reported only by the preview E2E
# workflows. Until then, GitHub lists it as expected and blocks merging, so
# no job here posts a pending placeholder that could land after the verdict.
permissions:
  contents: read

# Main pushes and PRs supersede older checks. A rerun keeps a group of its own,
# so rerunning an older run cannot cancel the current head's checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_attempt == 1 && (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISSPELL_VERSION: v0.3.4
      PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      PUBLIC_CONVEX_SITE_URL: https://placeholder.convex.site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # convex-consumer-compat compares against a baseline commit, which a
          # shallow checkout cannot resolve.
          fetch-depth: 0
      - name: Record checkout identity
        run: |
          {
            echo "### Checkout identity"
            echo
            echo "- expected: \`$GITHUB_SHA\`"
            echo "- commit: \`$(git rev-parse HEAD)\`"
            echo "- tree: \`$(git rev-parse 'HEAD^{tree}')\`"
            echo "- parents: \`$(git rev-parse 'HEAD^@' | tr '\n' ' ')\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Cache misspell binary
        id: misspell-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/misspell-bin
          key: misspell-${{ runner.os }}-${{ runner.arch }}-${{ env.MISSPELL_VERSION }}
      - if: steps.misspell-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 'stable'
          cache: false
      - if: steps.misspell-cache.outputs.cache-hit != 'true'
        env:
          GOBIN: ${{ runner.temp }}/misspell-bin
        run: go install -ldflags "-X main.version=$MISSPELL_VERSION" "github.com/client9/misspell/cmd/misspell@$MISSPELL_VERSION"
      - name: Verify misspell binary
        env:
          GOBIN: ${{ runner.temp }}/misspell-bin
        run: |
          test "$("$GOBIN/misspell" -v)" = "$MISSPELL_VERSION"
          echo "$GOBIN" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - name: Assert source identity after install
        run: |
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "Source identity lost: HEAD is $head, the event commit is $GITHUB_SHA." >&2
            exit 1
          fi
          status="$(git status --porcelain=v1 --untracked-files=all)"
          if [ -n "$status" ]; then
            echo "Source identity lost: the working tree no longer matches $GITHUB_SHA." >&2
            printf '%s\n' "$status" >&2
            # Show what changed so a one-off generator difference stays diagnosable.
            git diff --stat HEAD >&2 || true
            echo "Diff against HEAD (first 20000 bytes):" >&2
            git diff HEAD | head -c 20000 >&2 || true
            echo "Commit the regenerated file, or ignore it when it is build output." >&2
            exit 1
          fi
      # ESLint and Prettier take most of this job; this build's `bun lint` and `bun fmt`
      # run the same configs natively.
      - name: Install Bun with native Svelte linting
        env:
          URL: https://github.com/stickerdaniel/bun/releases/download/svelte-lint-b899fb95/bun-linux-x64.zip
          SHA256: 1fad3a8e8e9b6d9839c273efebace956532603019a02cd294908b11c013de680
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bun-lint.zip" "$URL"
          echo "$SHA256  $RUNNER_TEMP/bun-lint.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/bun-lint.zip" -d "$RUNNER_TEMP/bun-lint"
          echo "BUN_LINT_BINARY=$RUNNER_TEMP/bun-lint/bun-linux-x64/bun" >> "$GITHUB_ENV"
      - run: bun scripts/static-checks.ts --ci --scope lint
      # Unit Tests runs this too, but the README tells forks to require only this job.
      - name: Check that the committed icons match static/logo.svg
        run: bun vitest --config vitest.tooling.config.ts --run scripts/generate-logos.test.ts
      # Refuses to remove a Convex function that deployed app code still calls
      # (see https://github.com/stickerdaniel/saas-starter/issues/789). The PR run
      # checks its candidate; later target changes require integration inspection.
      # Hosting builds may already be running when the push copy reports a problem.
      # Its baseline is the pre-push SHA because a push
      # can carry several commits, and the parent of HEAD would let the first one
      # bless a rename the deployed build never saw.
      - run: bun run check:convex-compat
        env:
          CONVEX_COMPAT_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
      - name: Assert source identity after checks
        run: |
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "Source identity lost: HEAD is $head, the event commit is $GITHUB_SHA." >&2
            exit 1
          fi
          status="$(git status --porcelain=v1 --untracked-files=all)"
          if [ -n "$status" ]; then
            echo "Source identity lost: the working tree no longer matches $GITHUB_SHA." >&2
            printf '%s\n' "$status" >&2
            # Show what changed so a one-off generator difference stays diagnosable.
            git diff --stat HEAD >&2 || true
            echo "Diff against HEAD (first 20000 bytes):" >&2
            git diff HEAD | head -c 20000 >&2 || true
            echo "Commit the regenerated file, or ignore it when it is build output." >&2
            exit 1
          fi

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      PUBLIC_CONVEX_SITE_URL: https://placeholder.convex.site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun scripts/static-checks.ts --ci --scope types

  browser-fixtures:
    name: Browser Fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # Each check serves a fixture component from its own Vite server and reads no generated file.
      - run: bun install --frozen-lockfile --ignore-scripts
      # The runner image ships Chrome's system libraries. --with-deps adds an apt
      # download from the Ubuntu mirror, which has stalled this job past its timeout.
      - run: bunx playwright install chromium --only-shell
      - run: bun run check:table-scroll
      - run: bun run check:streamdown-overlay

  unit-test-shards:
    name: Unit Tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      PUBLIC_CONVEX_SITE_URL: https://placeholder.convex.site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run test:unit --shard=${{ matrix.shard }}/2

  unit-tests:
    name: Unit Tests
    needs: unit-test-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # A cancelled run keeps this always() job alive but skips steps that rely on
      # the implicit success(), so the shard check must run in every outcome.
      - name: Require every unit test shard to pass
        if: always()
        env:
          SHARD_RESULT: ${{ needs.unit-test-shards.result }}
        run: |
          if [ "$SHARD_RESULT" != 'success' ]; then
            echo "::error::Every unit test shard must pass; result was $SHARD_RESULT."
            exit 1
          fi

  upstream-report-tests:
    name: Upstream Report Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The selection lists the pull request's changed files.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Only the suite's inputs, as listed in scripts/upstream-report-scope.ts, so a test that
      # reads any other path fails here rather than being skipped when that path changes.
      # Non-cone mode leaves out root files the list does not name, and the blobless clone
      # leaves their objects out of the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.agents/skills/upstream-report/
            /package.json
            /bun.lock
            /bunfig.toml
            /.npmrc
            /patches/
            /scripts/vitest-settings.ts
            /tsconfig.tooling.json
            /.github/workflows/static-checks.yml
            /scripts/upstream-report-scope.ts
            **/.gitattributes
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # The check is required, so the job always reports and only runs the suite when a
      # pull request changes one of its inputs. A missing selection runs it.
      - name: Select the upstream report tests
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_SUITE: ${{ vars.CI_FULL_SUITE }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: bun scripts/upstream-report-scope.ts
      # The tests read no generated file. Without lazy fetching, reading an object outside the
      # checkout fails instead of downloading it; the checkout itself still needs to fetch.
      - if: steps.scope.outputs.run != 'false'
        env:
          GIT_NO_LAZY_FETCH: '1'
        run: bun install --frozen-lockfile --ignore-scripts
      - if: steps.scope.outputs.run != 'false'
        env:
          GIT_NO_LAZY_FETCH: '1'
        run: bun run test:upstream-report
