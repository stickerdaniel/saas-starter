<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon-96x96.png" sizes="96x96" />
		<link rel="shortcut icon" href="%sveltekit.assets%/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="SaaS Starter" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<script>
			(() => {
				// A failed chunk import means a deploy replaced the build: reload once
				// to fetch it. The root layout can keep the page while a file is in
				// flight, which the reload would discard; the attempt then stays
				// unspent for the next failure. Never preventDefault: Vite rethrows
				// the failed import to its caller only while the event is unprevented.
				let hold = null;
				window.addEventListener('vite:preloadError', () => {
					if (sessionStorage.getItem('sk:preload-reloaded')) return;
					if (hold !== null && hold()) return;
					sessionStorage.setItem('sk:preload-reloaded', '1');
					location.reload();
				});
				window.__deployRecovery = {
					hold(next) {
						hold = next;
						return () => {
							if (hold === next) hold = null;
						};
					}
				};
				// Expose that the deploy-recovery backstop is wired so E2E can
				// observe readiness before simulating a stale chunk load.
				window.__deployReloadArmed = true;
			})();
		</script>
		<script>
			(() => {
				let mode = 'system';
				try {
					mode = localStorage.getItem('mode-watcher-mode') ?? 'system';
					localStorage.setItem('mode-watcher-mode', mode);
				} catch {}
				const light =
					mode === 'light' ||
					(mode === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
				document.documentElement.classList.toggle('dark', !light);
				document.documentElement.style.colorScheme = light ? 'light' : 'dark';
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
